<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Konfirmasi Pembayaran</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 10px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        .btn-pay {
            background-color: #4CAF50;
            color: white;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-pay:hover {
            background-color: #45a049;
        }

        h2 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Konfirmasi Pembayaran</h2>
    <p><strong>Nama Pembeli:</strong> <span th:text="${nama}"></span></p>
    <p><strong>Total Harga:</strong> Rp <span th:text="${total}"></span></p>
    <p><strong>Metode Pembayaran:</strong> Midtrans Snap</p>

    <form th:action="@{/pembayaran/submit}" method="post">
        <input type="hidden" name="orderId" th:value="${orderId}">
        <input type="hidden" name="total" th:value="${total}">
        <button type="submit" class="btn-pay">Bayar Sekarang</button>
    </form>
</div>

</body>
</html>
